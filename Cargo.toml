[package]
name = "orbit-dock"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.10"
cairo-rs = "0.17"
gdk-pixbuf = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evdev = "0.11"
notify = "6"
tokio = { version = "1", features = ["full"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
inotify = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[build-dependencies]

[profile.release]
opt-level = 3
lto = true
